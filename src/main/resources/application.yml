server:
  port: 8080

spring:
  application:
    name: resilience4j-reactor-learning

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Logging configuration
logging:
  level:
    root: INFO
    com.joker.resilience4j: DEBUG
    io.github.resilience4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Note: We are NOT using resilience4j.* configuration properties
# All Resilience4j configuration is done programmatically in Java code
# This demonstrates the pure resilience4j-reactor approach
